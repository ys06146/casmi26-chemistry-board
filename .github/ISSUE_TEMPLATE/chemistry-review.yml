name: Chemistry review question
description: Ask for evidence, a mechanism review, or a testable chemical feature.
title: "[Chemistry review] "
body:
  - type: markdown
    attributes:
      value: "For author-controlled deletion, use https://casmi26-chemistry-desk.jinseobae.chatgpt.site/. This GitHub thread remains public."
  - type: input
    id: case
    attributes:
      label: Case ID
      placeholder: "Example: confirm0003"
  - type: textarea
    id: observed
    attributes:
      label: Observed facts
      placeholder: "Example: confirmation-2465040, [M+H]+, 50 eV; base peak m/z 84.081."
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question for chemical review
      placeholder: "Example: Could both candidates produce C5H10N+? What evidence would distinguish them?"
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Current interpretation and references
      placeholder: "Separate proposed assignments from measured facts; include sources and confidence."
  - type: textarea
    id: next_test
    attributes:
      label: Counterexamples and next experiment
      placeholder: "What could make this interpretation wrong, and what one change should we test?"
